[package]
name = "meetrs"
version = "0.2.0"
edition = "2024"
license = "MIT"
description = "Terminal meeting recorder: captures mic + system audio, chunked on natural pauses"
repository = "https://github.com/kerryhatcher/meetrs"

[dependencies]
anyhow = "1.0.104"
chrono = "0.4.45"
# Pure-Rust FLAC encoder (up to 8 channels, 24-bit). Replaces the macOS-only
# afconvert shell-out in src/compress.rs. Default features (par, serde, log) are
# kept; the `decode` feature is not needed because decoding uses claxon.
flacenc = "0.5.1"
# Pure-Rust FLAC decoder. Used to verify each encoded chunk decodes to the same
# frame count before its WAV is deleted.
claxon = "0.4.3"
# Deterministic sentence-boundary detection, capitalization, and punctuation
# restoration for the human-readable transcript. Zero transitive deps, no models,
# no network. https://github.com/kerryhatcher/crustytts
crustytts-core = "0.3.4"
crustytts-sentence = "0.3.4"
# default-features = false: the embedded word list + edit-distance correction is
# all we want. The default `full` feature adds symspell/spellbook/nlprule (each
# needs dictionary files at runtime) and ollama (reqwest, +254 crates, network).
crustytts-spellcheck = { version = "0.4.0", default-features = false }
# Pure-Rust neural VAD with an embedded model: no ONNX runtime, no model
# download, nothing to sign. See docs/research/rust-audio-processing.md.
earshot = "1.2.1"
hound = "3.5.1"
# For flock(2). Chosen over a PID file because the kernel releases a flock when
# the process dies, even on SIGKILL — so there is no stale-lock case to handle.
libc = "0.2.189"
# Proper 48k->16k resampling for the ASR feed. The VAD gets away with a box
# filter; aliasing in the transcription input would cost accuracy.
rubato = "4.0.0"
# `bundled` compiles the SQLite amalgamation into this binary — no libsqlite3
# dylib, same precedent as whisper.cpp. FTS5 is included in bundled builds
# (verified: SQLite 3.53.2, highlight() and boolean MATCH both work).
rusqlite = { version = "0.40.1", features = ["bundled"] }
sha2 = "0.11.0"
# whisper.cpp, compiled from vendored source into this binary. No dylib, no
# external install. The `metal` feature (Apple GPU) is macOS-only; see the
# target table below.
whisper-rs = { version = "0.16.0" }
# native-tls uses the platform TLS library instead of vendoring ring's C and
# assembly: Security.framework on macOS, OpenSSL on Linux (so Linux builds need
# openssl-devel and pkgconf).
ureq = { version = "3.3.0", default-features = false, features = ["native-tls", "gzip"] }
ratatui = "0.30.2"
crossterm = "0.29.0"
rtrb = "0.3.4"
serde = { version = "1", features = ["derive"] }
serde_json = "1.0.151"
# YAML for ~/.meetrs/config.yaml. serde_yaml itself is archived; this is its
# maintained fork with the same API.
serde_yaml_ng = "0.10.0"

[target.'cfg(target_os = "macos")'.dependencies]
# Metal GPU backend for whisper.cpp. Cargo unifies this with the base
# whisper-rs entry above, so on macOS the crate is built with `metal`.
whisper-rs = { version = "0.16.0", features = ["metal"] }
# Core Audio process tap + aggregate device capture (src/capture/macos.rs).
block2 = "0.6.2"
dispatch2 = "0.3.1"
objc2 = "0.6.4"
objc2-core-audio = "0.3.2"
# objc2-core-audio uses these types but does not re-export them.
objc2-core-audio-types = "0.3.2"
objc2-core-foundation = "0.3.2"
objc2-foundation = "0.3.2"

[target.'cfg(target_os = "linux")'.dependencies]
# PipeWire capture backend (src/capture/linux.rs). Needs libpipewire-0.3 headers
# and libclang at build time, since pipewire-sys runs bindgen. The v0_3_44
# feature exposes the target.object key used to bind streams to the defaults.
pipewire = { version = "0.10.1", features = ["v0_3_44"] }
# Vulkan GPU backend for whisper.cpp, chosen over CPU on the reference box
# (Ryzen 7 6800U, Radeon 680M, 76 s clip, small.en-tdrz, median of 9 passes):
#   CPU (15 threads):  RTF 0.41, ~442 CPU-seconds per pass
#   Vulkan (RADV):     RTF 0.34, ~13 CPU-seconds per pass
#   OpenBLAS (CPU):    RTF 0.60 (slower than plain CPU, so not used)
# Vulkan is ~17% faster in wall time, and it moves nearly all the work off the
# CPU. That matters because chunks are transcribed while capture and the TUI
# keep running on the same cores. Transcripts differ by a few words between
# backends (see the commit body); both are equally imperfect.
#
# Build needs vulkan-headers, vulkan-loader-devel and glslc (Fedora package
# names; shaderc provides glslc on other distros). Runtime needs a Vulkan
# loader plus an ICD such as mesa-vulkan-drivers. Without a working ICD,
# whisper.cpp logs "no GPU found" and transcribes on the CPU, so the feature
# degrades rather than fails.
whisper-rs = { version = "0.16.0", features = ["vulkan"] }

[profile.release]
# An unwind across the Core Audio IOProc FFI boundary is not sound. The callback
# catches panics itself, but abort is the backstop. See docs/research/rust-audio-macos.md
panic = "abort"
