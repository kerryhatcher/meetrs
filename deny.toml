# cargo-deny policy: run as `cargo deny --all-features check` (see
# .github/workflows/security.yml). Advisories, licenses, bans and sources.

[graph]
all-features = true

[advisories]
ignore = [
    # unsafe-libyaml is unmaintained, and no safe upgrade exists. It is pulled in
    # by serde_yaml_ng, which parses only the user's own ~/.meetrs/config.yaml.
    # Input is local and trusted, so the risk is accepted here. Revisit when
    # serde_yaml_ng moves off it.
    { id = "RUSTSEC-2024-0449", reason = "config.yaml is a local, user-authored file; no safe upgrade exists" },
]

[licenses]
# Every license present in the dependency graph today. Adding one is a
# deliberate policy change, so review it here rather than letting it through.
allow = [
    "0BSD",
    "Apache-2.0",
    "Apache-2.0 WITH LLVM-exception",
    "BSD-3-Clause",
    "BSL-1.0",
    "CDLA-Permissive-2.0",
    "ISC",
    "MIT",
    "Unicode-3.0",
    "Unlicense",
    "Zlib",
]
confidence-threshold = 0.9

[bans]
# Duplicate versions are common in this graph (for example syn, hashbrown), so
# they are reported but do not fail the check.
multiple-versions = "warn"
wildcards = "deny"

[sources]
unknown-registry = "deny"
unknown-git = "deny"
allow-registry = ["https://github.com/rust-lang/crates.io-index"]
